name: create
on:
  workflow_dispatch:

concurrency:
  group: create
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1
      - run: pip install -r requirements.txt
      - name: Create video
        run: python main.py create
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          VIDEO_MODE: ${{ vars.VIDEO_MODE }}
          PHOTO_ZOOM: ${{ vars.PHOTO_ZOOM }}
          STORY_TYPE: ${{ vars.STORY_TYPE }}
          CHAR_REF: ${{ vars.CHAR_REF }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          SCRIPT_WRITER: ${{ vars.SCRIPT_WRITER }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_SCRIPT_MODEL: ${{ vars.GEMINI_SCRIPT_MODEL }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          TAVILY_DEPTH: ${{ vars.TAVILY_DEPTH }}
          NO_SEARCH: ${{ vars.NO_SEARCH }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_STEPS: ${{ vars.HF_STEPS }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          INSTANTID: ${{ vars.INSTANTID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save data (history, heroes)
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data characters 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "data: update"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 3; done