name: create

'on':
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема ролика (пусто = случайная)"
        required: false
        default: ""
      script:
        description: "Готовый сценарий (пусто = бот пишет сам)"
        required: false
        default: ""

concurrency:
  group: browser-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISPLAY: ":99"
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SESSION_BACKUP_KEY: ${{ secrets.SESSION_BACKUP_KEY }}
      REMOTE_DESKTOP_PASSWORD: ${{ secrets.REMOTE_DESKTOP_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN1: ${{ secrets.HF_TOKEN1 }}
      HF_TOKEN2: ${{ secrets.HF_TOKEN2 }}
      HF_TOKEN3: ${{ secrets.HF_TOKEN3 }}
      HF_TOKEN4: ${{ secrets.HF_TOKEN4 }}
      HF_TOKEN5: ${{ secrets.HF_TOKEN5 }}
      HF_TOKEN6: ${{ secrets.HF_TOKEN6 }}
      HORDE_API_KEY: ${{ secrets.HORDE_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID1: ${{ secrets.CF_ACCOUNT_ID1 }}
      CF_API_TOKEN1: ${{ secrets.CF_API_TOKEN1 }}
      CF_ACCOUNT_ID2: ${{ secrets.CF_ACCOUNT_ID2 }}
      CF_API_TOKEN2: ${{ secrets.CF_API_TOKEN2 }}
      CF_ACCOUNT_ID3: ${{ secrets.CF_ACCOUNT_ID3 }}
      CF_API_TOKEN3: ${{ secrets.CF_API_TOKEN3 }}
      TOPIC: ${{ inputs.topic }}
      SCRIPT_TEXT: ${{ inputs.script }}
      RESUME: ${{ vars.RESUME }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
      VIDEO_MODE: ${{ vars.VIDEO_MODE }}
      PHOTO_ZOOM: ${{ vars.PHOTO_ZOOM }}
      STORY_TYPE: ${{ vars.STORY_TYPE }}
      CHAR_REF: ${{ vars.CHAR_REF }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
      SCRIPT_WRITER: ${{ vars.SCRIPT_WRITER }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      GEMINI_SCRIPT_MODEL: ${{ vars.GEMINI_SCRIPT_MODEL }}
      GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      TAVILY_DEPTH: ${{ vars.TAVILY_DEPTH }}
      NO_SEARCH: ${{ vars.NO_SEARCH }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      HF_STEPS: ${{ vars.HF_STEPS }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
      INSTANTID: ${{ vars.INSTANTID }}
      IMG2IMG_SPACE: ${{ vars.IMG2IMG_SPACE }}
      IMG2IMG_STRENGTH: ${{ vars.IMG2IMG_STRENGTH }}
      GENSPARK_REMOTE: "1"
      GENSPARK_HEADLESS: "0"
      GENSPARK_ACCOUNTS: ${{ vars.GENSPARK_ACCOUNTS }}
      GENSPARK_URL: ${{ vars.GENSPARK_URL }}
      GENSPARK_TIMEOUT: ${{ vars.GENSPARK_TIMEOUT }}
      GENSPARK_RETRIES: ${{ vars.GENSPARK_RETRIES }}
      GENSPARK_ROUNDS: ${{ vars.GENSPARK_ROUNDS }}
      GENSPARK_MANUAL_WAIT: ${{ vars.GENSPARK_MANUAL_WAIT }}
      GENSPARK_ALLOW_FALLBACK: ${{ vars.GENSPARK_ALLOW_FALLBACK }}
      GENSPARK_INPUT_SELECTOR: ${{ vars.GENSPARK_INPUT_SELECTOR }}
      GENSPARK_ANSWER_SELECTOR: ${{ vars.GENSPARK_ANSWER_SELECTOR }}
      GENSPARK_STORAGES: ${{ secrets.GENSPARK_STORAGES }}
      GENSPARK_STORAGE_1: ${{ secrets.GENSPARK_STORAGE_1 }}
      GENSPARK_STORAGE_2: ${{ secrets.GENSPARK_STORAGE_2 }}
      GENSPARK_STORAGE_3: ${{ secrets.GENSPARK_STORAGE_3 }}
      GENSPARK_STORAGE_4: ${{ secrets.GENSPARK_STORAGE_4 }}
      GENSPARK_STORAGE_5: ${{ secrets.GENSPARK_STORAGE_5 }}
      GENSPARK_STORAGE_6: ${{ secrets.GENSPARK_STORAGE_6 }}
      GENSPARK_STORAGE_7: ${{ secrets.GENSPARK_STORAGE_7 }}
      GENSPARK_STORAGE_8: ${{ secrets.GENSPARK_STORAGE_8 }}
      GENSPARK_STORAGE_9: ${{ secrets.GENSPARK_STORAGE_9 }}
      GENSPARK_STORAGE_10: ${{ secrets.GENSPARK_STORAGE_10 }}
      ANIMATE: ${{ vars.ANIMATE }}
      MAX_ANIMATE: ${{ vars.MAX_ANIMATE }}
      GENSPARK_ANIM_MODEL: ${{ vars.GENSPARK_ANIM_MODEL }}
      GENSPARK_ANIM_DURATION: ${{ vars.GENSPARK_ANIM_DURATION }}
      GENSPARK_ANIM_QUALITY: ${{ vars.GENSPARK_ANIM_QUALITY }}
      GENSPARK_VIDEO_MODE: ${{ vars.GENSPARK_VIDEO_MODE }}
      GENSPARK_VIDEO_TIMEOUT: ${{ vars.GENSPARK_VIDEO_TIMEOUT }}
      GENSPARK_VIDEO_URL: ${{ vars.GENSPARK_VIDEO_URL }}
      GENSPARK_FINAL_EDITOR: ${{ vars.GENSPARK_FINAL_EDITOR }}
      GENSPARK_EDITOR_TIMEOUT: ${{ vars.GENSPARK_EDITOR_TIMEOUT }}
      GENSPARK_FINAL_DOWNLOAD_SELECTOR: ${{ vars.GENSPARK_FINAL_DOWNLOAD_SELECTOR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Tailscale auth key
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [[ "$TS_AUTHKEY" != tskey-auth-* ]]; then
            echo "::error::Create TS_AUTHKEY in GitHub Secrets using a Tailscale Auth key."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate encrypted backup secret
        run: python runner_state.py validate-key
      - name: Restore encrypted progress
        run: python runner_state.py restore
      - name: Install desktop and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core xvfb x11vnc novnc websockify fluxbox x11-utils
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Prepare private Tailscale state directory
        run: |
          sudo install -d -m 700 -o root -g root /var/lib/tailscale
      - name: Connect private Tailscale network
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: /var/lib/tailscale
          tags: tag:ci
          hostname: ff-${{ github.run_id }}-${{ github.run_attempt }}
          log-mode: normal
          timeout: 2m
          retry: "2"
      - name: Diagnose Tailscale connection failure
        if: ${{ always() && steps.tailscale.outcome == 'failure' }}
        run: |
          echo "::error::Tailscale login failed. Check TS_AUTHKEY, its expiry and tag:ci."
          sudo tailscale status 2>&1 | sed -E 's/tskey-[A-Za-z0-9_-]+/[REDACTED]/g' || true
      - name: Start private remote desktop
        id: remote_desktop
        if: ${{ steps.tailscale.outcome == 'success' }}
        run: |
          bash runner_remote.sh
          echo "Checking private HTTPS endpoints, not just Tailscale device status."
          sudo tailscale serve status
          host=$(sudo tailscale status --json | python3 -c 'import json,sys; h=json.load(sys.stdin)["Self"]["DNSName"].rstrip("."); assert h.endswith(".ts.net") and all(c.isalnum() or c in ".-" for c in h), "Invalid Tailscale DNS name"; print(h)')
          if ! curl --fail --show-error --silent --retry 2 --retry-all-errors --connect-timeout 5 --max-time 15 "https://${host}/vnc.html" --output /dev/null; then
            echo "::error::Private HTTPS screen is unavailable. Check the curl error and Tailscale Serve configuration above."
            exit 1
          fi
          if ! curl --fail --show-error --silent --retry 2 --retry-all-errors --connect-timeout 5 --max-time 15 "https://${host}:8443/" --output /dev/null; then
            echo "::error::Private HTTPS confirmation page is unavailable."
            exit 1
          fi
          echo "Private HTTPS endpoints responded successfully from the runner. Phone access still depends on tailnet connectivity and ACLs."
      - name: Create video
        if: ${{ steps.tailscale.outcome == 'success' && steps.remote_desktop.outcome == 'success' }}
        run: python run_job.py create
      - name: Encrypt progress and sessions
        if: always()
        run: python runner_state.py snapshot
      - name: Upload encrypted checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freefire-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state-backup/state.enc
          if-no-files-found: warn
          retention-days: 14
      - name: Save non-secret history and settings
        if: always()
        run: bash save_data.sh
      - name: Close private remote access
        if: ${{ always() && steps.tailscale.outcome == 'success' }}
        run: sudo tailscale serve reset || true
      - name: Report failed remote connection
        if: ${{ always() && steps.tailscale.outcome == 'failure' }}
        run: |
          echo "::error::Remote connection failed. This run did not log in to Genspark."
          exit 1
