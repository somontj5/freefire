name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q requests playwright
      - name: Install Playwright Chromium (для сайта genspark.ai)
        run: python -m playwright install --with-deps chromium
      - name: Listen to Telegram
        run: python3 main.py poll
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENSPARK_ACCOUNTS: ${{ vars.GENSPARK_ACCOUNTS }}
          GENSPARK_URL: ${{ vars.GENSPARK_URL }}
          GENSPARK_ROUNDS: ${{ vars.GENSPARK_ROUNDS }}
          GENSPARK_STORAGES: ${{ secrets.GENSPARK_STORAGES }}
          GENSPARK_STORAGE_1: ${{ secrets.GENSPARK_STORAGE_1 }}
          GENSPARK_STORAGE_2: ${{ secrets.GENSPARK_STORAGE_2 }}
          GENSPARK_STORAGE_3: ${{ secrets.GENSPARK_STORAGE_3 }}
          GENSPARK_STORAGE_4: ${{ secrets.GENSPARK_STORAGE_4 }}
          GENSPARK_STORAGE_5: ${{ secrets.GENSPARK_STORAGE_5 }}
          GENSPARK_STORAGE_6: ${{ secrets.GENSPARK_STORAGE_6 }}
          GENSPARK_STORAGE_7: ${{ secrets.GENSPARK_STORAGE_7 }}
          GENSPARK_STORAGE_8: ${{ secrets.GENSPARK_STORAGE_8 }}
          GENSPARK_STORAGE_9: ${{ secrets.GENSPARK_STORAGE_9 }}
          GENSPARK_STORAGE_10: ${{ secrets.GENSPARK_STORAGE_10 }}
          ANIMATE: ${{ vars.ANIMATE }}
          MAX_ANIMATE: ${{ vars.MAX_ANIMATE }}
          GENSPARK_ANIM_MODEL: ${{ vars.GENSPARK_ANIM_MODEL }}
          GENSPARK_ANIM_DURATION: ${{ vars.GENSPARK_ANIM_DURATION }}
          GENSPARK_ANIM_QUALITY: ${{ vars.GENSPARK_ANIM_QUALITY }}
          GENSPARK_VIDEO_TIMEOUT: ${{ vars.GENSPARK_VIDEO_TIMEOUT }}
          GENSPARK_VIDEO_URL: ${{ vars.GENSPARK_VIDEO_URL }}
      - name: Save data
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "data: update"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 3; done
